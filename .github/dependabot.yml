version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    # Defer routine major upgrades until the migrations in docs/dependency-updates.md.
    # update-types leaves security updates eligible; do not replace with version ranges.
    ignore:
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Keep coupled packages ahead of the routine catch-all.
      next:
        patterns:
          - next
          - eslint-config-next
      auth:
        patterns:
          - next-auth
          - "@auth/*"
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      playwright:
        patterns:
          - playwright
          - "@playwright/*"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"
