version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      auth:
        patterns:
          - next-auth
          - "@auth/*"
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      playwright:
        patterns:
          - playwright
          - "@playwright/*"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
